[package]
name = "pdf-to-markdown"
version = "0.1.0"
edition = "2021"
authors = ["PonyNotes Team"]
description = "A powerful Rust library for converting PDF files to Markdown format"
license = "MIT"
repository = "https://github.com/PonyNotes/pdf-to-markdown"

[workspace]

[dependencies]
# PDF parsing libraries
pdf-extract = "0.7"

# Text processing and formatting
regex = "1.10"

# Error handling and utilities
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Optional: For advanced PDF processing
# poppler-rs = "0.1"  # Uncomment if you want to use Poppler bindings

[dev-dependencies]
tempfile = "3.8"
criterion = "0.5"

[[bench]]
name = "pdf_parsing"
harness = false

[features]
default = []
