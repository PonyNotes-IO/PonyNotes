[package]
name = "pdf-processor"
version = "0.1.0"
edition = "2021"
authors = ["PonyNotes Team"]
description = "A simple PDF processor for Flutter integration"

[dependencies]
# PDF parsing libraries
pdf-extract = "0.7"

# Text processing and formatting
regex = "1.10"

# Error handling and utilities
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"